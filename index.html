<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>राजभाषा हिन्दी — KBC Style Quiz</title>
<style>
:root{--bg:#05051d;--panel:#11134a;--panel2:#181a62;--gold:#ffd447;--gold2:#ff9d00;--text:#fff;--muted:#bfc5ff;--good:#19c37d;--bad:#ff4d67}
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:radial-gradient(circle at 50% 10%,#242b87 0,#080923 42%,#030310 100%);color:var(--text);min-height:100vh}
header{text-align:center;padding:20px 15px 8px}.logo{display:inline-flex;width:88px;height:88px;border:5px solid var(--gold);border-radius:50%;align-items:center;justify-content:center;background:#0b0d42;box-shadow:0 0 28px #ffd44755;font-weight:900;font-size:25px;color:var(--gold)}h1{margin:10px 0 3px;font-size:clamp(22px,4vw,38px)}header p{margin:0;color:var(--muted)}
.wrap{max-width:1050px;margin:auto;padding:14px}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.pill{background:#10134b;border:1px solid #4e56b4;border-radius:999px;padding:8px 14px}.money{color:var(--gold);font-weight:800}
.lifelines{display:flex;gap:8px;flex-wrap:wrap}.life{border:1px solid var(--gold);background:#12154e;color:white;border-radius:9px;padding:9px 12px;cursor:pointer}.life:disabled{opacity:.35;cursor:not-allowed}
.progress{height:8px;background:#171943;border-radius:99px;margin:15px 0;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:.3s}
.card{background:linear-gradient(145deg,#15185b,#090b32);border:1px solid #424aa4;border-radius:20px;padding:24px;box-shadow:0 15px 45px #0008}.qnum{color:var(--gold);font-weight:800}.question{font-size:clamp(20px,3vw,30px);line-height:1.4;margin:12px 0 22px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:13px}.opt{padding:16px;border:1px solid #5961bf;background:#11134a;color:#fff;border-radius:12px;text-align:right;cursor:pointer;font-size:17px;transition:.2s}.opt:hover{background:#202475;border-color:var(--gold)}.opt.disabled{opacity:.25;pointer-events:none}.opt.correct{background:#0d704d;border-color:#36efab}.opt.wrong{background:#8d2034;border-color:#ff7184}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:18px;align-items:center}.next,.restart{border:0;border-radius:10px;padding:12px 20px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#111}.next:disabled{opacity:.35;cursor:not-allowed}.timer{font-size:22px;color:var(--gold);font-weight:800}
.hidden{display:none}.result{text-align:center}.result h2{font-size:32px;color:var(--gold)}.house{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 18px}.house button{background:#10134b;border:1px solid #5961bf;color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}.house button.active{border-color:var(--gold);color:var(--gold)}
.note{font-size:13px;color:var(--muted);margin-top:15px;line-height:1.5}
@media(max-width:700px){.options{grid-template-columns:1fr}.card{padding:18px}.opt{text-align:left}.top{align-items:flex-start}}
</style>
</head>
<body>
<header><div class="logo">KBC</div><h1>राजभाषा हिन्दी — शिक्षक प्रश्नोत्तरी</h1><p>Knowledge Challenge • PM SHRI KV Mashrak</p></header>
<main class="wrap">
<div class="house" id="houses"></div>
<div class="top">
<div class="pill">प्रश्न <span id="count">1/40</span></div>
<div class="pill money">स्कोर: ₹<span id="score">0</span></div>
<div class="pill">समय: <span id="timer">30</span>s</div>
<div class="lifelines">
<button class="life" id="fifty" onclick="fifty()">50:50</button>
<button class="life" id="audience" onclick="audience()">Audience Poll</button>
<button class="life" id="phone" onclick="phone()">Phone-a-Friend</button>
</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="card" id="quizCard">
<div class="qnum" id="qnum"></div><div class="question" id="question"></div><div class="options" id="options"></div>
<div class="controls"><div class="timer">⏱ <span id="timer2">30</span></div><button class="next" id="next" disabled onclick="nextQ()">अगला प्रश्न →</button></div>
<div class="note" id="feedback"></div>
</section>
<section class="card result hidden" id="result">
<h2>क्विज़ पूर्ण!</h2><p id="finalText"></p><button class="restart" onclick="restart()">फिर से शुरू करें</button>
</section>
</main>
<script>
const questions = [{"q": "भारतीय संविधान के अनुच्छेद 343 के अनुसार संघ की राजभाषा क्या है?", "o": ["हिन्दी, देवनागरी लिपि", "अंग्रेज़ी, रोमन लिपि", "संस्कृत, देवनागरी लिपि", "हिन्दी, रोमन लिपि"], "a": 0, "r": "अनुच्छेद 343 में संघ की राजभाषा हिन्दी और लिपि देवनागरी निर्धारित की गई है।"}, {"q": "संविधान का कौन-सा अनुच्छेद हिन्दी के विकास और प्रसार के लिए निर्देश देता है?", "o": ["अनुच्छेद 343", "अनुच्छेद 344", "अनुच्छेद 350", "अनुच्छेद 351"], "a": 3, "r": "अनुच्छेद 351 हिन्दी के विकास और प्रसार से संबंधित है।"}, {"q": "राजभाषा अधिनियम, 1963 की धारा 3(3) का प्रमुख व्यावहारिक उद्देश्य क्या है?", "o": ["केवल हिन्दी में आदेश जारी करना", "निर्दिष्ट दस्तावेजों का हिन्दी और अंग्रेज़ी दोनों में जारी होना", "केवल अंग्रेज़ी में रिपोर्ट बनाना", "केवल मौखिक संचार करना"], "a": 1, "r": "धारा 3(3) में निर्दिष्ट दस्तावेजों के लिए हिन्दी और अंग्रेज़ी दोनों के प्रयोग का प्रावधान है।"}, {"q": "निम्न में से कौन-सा धारा 3(3) के अंतर्गत आने वाले दस्तावेज का उदाहरण है?", "o": ["व्यक्तिगत डायरी", "सामान्य आदेश/परिपत्र", "व्यक्तिगत अवकाश-डायरी", "अनौपचारिक निजी संदेश"], "a": 1, "r": "सामान्य आदेश और परिपत्र धारा 3(3) में सूचीबद्ध दस्तावेजों में आते हैं।"}, {"q": "राजभाषा नियम, 1976 के अनुसार भारत को राजभाषा कार्य के लिए कितने क्षेत्रों में बाँटा गया है?", "o": ["दो", "तीन", "चार", "पाँच"], "a": 1, "r": "नियमों में क्षेत्र A, क्षेत्र B और क्षेत्र C—तीन क्षेत्र निर्धारित हैं।"}, {"q": "PDF में दिए वर्गीकरण के अनुसार बिहार किस क्षेत्र में है?", "o": ["क्षेत्र A", "क्षेत्र B", "क्षेत्र C", "किसी क्षेत्र में नहीं"], "a": 0, "r": "प्रस्तुति में बिहार को क्षेत्र A में रखा गया है।"}, {"q": "नियम 5 के अनुसार केन्द्रीय सरकारी कार्यालय को हिन्दी में प्राप्त पत्र का उत्तर किस भाषा में दिया जाना चाहिए?", "o": ["केवल अंग्रेज़ी में", "हिन्दी में", "केवल संस्कृत में", "किसी भी भाषा में, बिना किसी नियम के"], "a": 1, "r": "नियम 5 के अनुसार हिन्दी में प्राप्त पत्र का उत्तर हिन्दी में दिया जाना चाहिए।"}, {"q": "नियम 6 के अनुसार धारा 3(3) वाले दस्तावेजों के संबंध में क्या अपेक्षा है?", "o": ["केवल हिन्दी", "केवल const $=id=>document.getElementById(id);

function answer(n,btn){if(answered)return;answered=true;clearInterval(timerId);document.querySelectorAll('.opt').forEach((b,k)=>{if(k===questions[i].a)b.classList.add('correct');if(k===n&&n!==questions[i].a)b.classList.add('wrong');b.style.pointerEvents='none'});if(n===questions[i].a){score+=money[Math.min(i,money.length-1)];$('feedback').textContent='सही उत्तर। '+questions[i].r}else{$('feedback').textContent='सही उत्तर: '+questions[i].o[questions[i].a]+' — '+questions[i].r}$('score').textContent=score.toLocaleString('en-IN');$('next').disabled=false}
function nextQ(){if(!answered)return;i++;if(i>=questions.length){$('quizCard').classList.add('hidden');$('result').classList.remove('hidden');$('finalText').innerHTML='<b>'+house+'</b> का अंतिम स्कोर: <strong>₹'+score.toLocaleString('en-IN')+'</strong><br>कुल प्रश्न: '+questions.length;return}render()}
function fifty(){if(used.fifty||answered)return;used.fifty=true;$('fifty').disabled=true;let wrong=questions[i].o.map((_,n)=>n).filter(n=>n!==questions[i].a);wrong.sort(()=>Math.random()-.5).slice(0,2).forEach(n=>$('options').children[n].classList.add('disabled'))}
function audience(){if(used.audience||answered)return;used.audience=true;$('audience').disabled=true;let correct=55+Math.floor(Math.random()*25);alert('Audience Poll (simulated)\\nA: '+(i%4===0?correct:Math.floor((100-correct)/3))+'%\\nB: '+(i%4===1?correct:Math.floor((100-correct)/3))+'%\\nC: '+(i%4===2?correct:Math.floor((100-correct)/3))+'%\\nD: '+(i%4===3?correct:Math.floor((100-correct)/3))+'%');}
function phone(){if(used.phone||answered)return;used.phone=true;$('phone').disabled=true;alert('Phone-a-Friend (simulated): मित्र का सुझाव है कि प्रश्न में राजभाषा अधिनियम/नियमों से जुड़ी मुख्य शर्त को ध्यान से देखें।')}
